services:

  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: mes-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mes-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  minio:
    # Образы minio/minio (Docker Hub) и quay.io/minio/minio больше не раздаются:
    # MinIO распространяет community-версию только исходниками. Сборка Chainguard — тот же сервер.
    image: cgr.dev/chainguard/minio:latest
    container_name: mes-minio
    command: server /data --console-address ":9001"
    # Образ работает от пользователя 65532, а новый том создаётся владельцем root.
    # Для локального стенда запускаем от root, чтобы MinIO мог писать в /data.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    # healthcheck не задан: в образе нет curl/wget

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: mes-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  mes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mes-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mes
      DB_USER: mes
      DB_PASSWORD: mes
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Токен выдаётся браузеру через localhost:8081, поэтому в поле iss будет этот адрес.
      # Ключи подписи приложение забирает по внутреннему адресу контейнера Keycloak.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/mes
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mes/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: batch-passports
    ports:
      - "8080:8080"

volumes:
  pg-data:
  minio-data:
